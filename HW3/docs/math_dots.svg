<text x="433.0" y="162.0" font-size="11" fill="#9a3412">中心 16</text>
<text x="337" y="252" font-size="11" fill="#6b7280">0</text><text x="508" y="252" font-size="11" fill="#6b7280">32</text>
<text x="386.5" y="252" font-size="11" fill="#9a3412">9</text><text x="460.5" y="252" font-size="11" fill="#9a3412">23</text>
<text x="532" y="74" font-size="12" fill="#9a3412">虛線框：點可能出現的範圍</text>
<text x="532" y="98" font-size="12" fill="#9a3412">9 ~ 23（9 + 2 × 雜湊的 3 bit）</text>
<text x="532" y="122" font-size="12" fill="#2563eb">藍點：這一格的點 (pu, pv)</text>
<text x="532" y="146" font-size="12" fill="#2563eb">淺藍：|wu − pu| ≤ 2 且</text>
<text x="532" y="170" font-size="12" fill="#2563eb">|wv − pv| ≤ 2 → 點亮</text>
<text x="532" y="194" font-size="12" fill="#374151">wu、wv：像素在格內的位置</text>
<text x="532" y="218" font-size="12" fill="#374151">＝ u、v 的第 16 ~ 12 位</text>
<text x="12" y="331" font-size="12" fill="#1f2937">u、v 是「像素 × 2^14」的定點數，所以：</text>
<text x="28" y="351" font-size="12" fill="#1f2937">第 24 ~ 17 位 = 格子編號（2^17 = 8 像素）　｜　第 16 ~ 12 位 = 格內位置（2^12 = 1/4 像素）　｜　第 11 ~ 0 位不用</text>
</svg>
