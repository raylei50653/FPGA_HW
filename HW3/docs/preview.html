<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HW3 瀏覽器預覽</title>
<style>
  :root {
    --bg: #15171a;
    --panel: #1e2125;
    --fg: #e4e6e8;
    --muted: #9aa0a6;
    --line: #353a40;
    --btn: #2a2e33;
    --btn-hover: #353a40;
    --led-off: #33373c;
    --led-on: #5df27a;
    --accent: #7cb7ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.6 system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  main { max-width: 672px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
    image-rendering: pixelated;
    border: 1px solid var(--line);
  }
  .panel {
    margin-top: 12px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 10px; }
  button {
    font: inherit;
    color: var(--fg);
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  button b { color: var(--accent); font-weight: 600; margin-right: 4px; }
  label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .leds { display: flex; gap: 6px; align-items: center; }
  .led {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--led-off);
    border: 1px solid var(--line);
  }
  .led.on { background: var(--led-on); box-shadow: 0 0 6px var(--led-on); }
  .muted { color: var(--muted); }
  #status { min-height: 1.6em; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>HW3 瀏覽器預覽</h1>
  <p>
    用 JavaScript 照 <code>SPEC.md</code> 重做一次 HW3 的畫面：每個像素一條光線、比較樹取進入面與離開面、
    打光、兩像素寬的稜線、全息點雲的雜湊與背面虛線。數學與測試檔的浮點參考模型相同，和硬體的定點管線
    只會在面的交界、點的邊緣差一個像素。按鈕對應板子上的按鍵。
  </p>

  <canvas id="screen" width="640" height="480"></canvas>

  <div class="panel">
    <div class="row">
      <button id="btnU"><b>BTNU</b>模式</button>
      <button id="btnD"><b>BTND</b>樣式</button>
      <button id="btnL"><b>BTNL</b>轉速</button>
      <button id="btnR"><b>BTNR</b>反轉</button>
      <button id="btnC"><b>BTNC</b>reset</button>
      <label><input type="checkbox" id="sw0"> SW0 暫停</label>
    </div>
    <div class="row">
      <span class="muted">LD7..LD0</span>
      <div class="leds" id="leds"></div>
      <span id="stateText" class="muted"></span>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <button id="gifBtn">匯出 GIF</button>
      <span class="muted">從角度 0 開始，轉速 ×4：前半段實心打光、後半段全息點雲，裁成形體所在的 640 × 240</span>
    </div>
    <div class="row"><span id="status" class="muted"></span></div>
  </div>
</main>

<script>
'use strict';

// ---------------------------------------------------------------------------
// 設定：與 src/HW_3.vhd 的預設 generic 相同
// ---------------------------------------------------------------------------
const W = 640, H = 480;
const SHAPES = 3;
const SOLID = [0, 1, 2];                 // 立方體、八面體、十二面體
const FACES = [6, 8, 12];
const SPIN_X = [2, 3, -1];               // 每幀繞 x 軸轉 SPIN × 2^speed 步（一圈 1024 步）
const SPIN_Y = [3, -2, 2];
const CX = [Math.floor(W / 6), Math.floor(W / 2), Math.floor(5 * W / 6)];
const CY = H / 2;
const RADIUS = Math.floor(W * 5 / 32);
const BASE = [[255, 0, 0], [0, 255, 0], [0, 0, 255]];
const BLOCKS = [                         // 基本模式的色塊：X、Y、W、H、通道
  [0, 0, 214, 480, 0],                   // 畫面直切三等分、不留黑（交界在偶數 x，見 SPEC §6.1）
  [214, 0, 212, 480, 1],
  [426, 0, 214, 480, 2],
];
const FRAME_HZ = 25e6 / (800 * 525);    // 25 MHz 像素率下的幀率，約 59.5 Hz
const DOT_KEEP = 192;                    // 點雲：每格保留 192 / 256

// ---------------------------------------------------------------------------
// 多面體幾何（HW_3_solid 在 elaboration 時算的表）
// ---------------------------------------------------------------------------
const PHI = (1 + Math.sqrt(5)) / 2;

function cyc(g, p, q) {
  const t = [0, p, q];
  return [t[g % 3], t[(1 + g) % 3], t[(2 + g) % 3]];
}

function baseNormal(sol, k) {
  const s = b => ((k >> b) & 1) ? -1 : 1;
  switch (sol) {
    case 0: { const v = [0, 0, 0]; v[k >> 1] = s(0); return v; }
    case 1: return [s(0), s(1), s(2)];
    case 2: return cyc(k >> 2, s(0), s(1) * PHI);
    default: return k < 8 ? [s(0), s(1), s(2)] : cyc((k - 8) >> 2, s(0) / PHI, s(1) * PHI);
  }
}

function inRatio(sol) {
  return sol <= 1 ? 1 / Math.sqrt(3) : Math.sqrt((5 + 2 * Math.sqrt(5)) / 15);
}

function unit(v) {
  const l = Math.hypot(v[0], v[1], v[2]);
  return [v[0] / l, v[1] / l, v[2] / l];
}

function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}

// 先繞 y 轉 b、再繞 x 轉 a
function rot(v, a, b) {
  const x = Math.cos(b) * v[0] + Math.sin(b) * v[2];
  const z1 = Math.cos(b) * v[2] - Math.sin(b) * v[0];
  return [x, Math.cos(a) * v[1] - Math.sin(a) * z1, Math.sin(a) * v[1] + Math.cos(a) * z1];
}

// 法向量與兩個切向量，套上初始傾斜 Rx(30°)·Ry(40°)
const VEC = SOLID.map((sol, k) => {
  const n = [], t1 = [], t2 = [];
  for (let f = 0; f < FACES[k]; f++) {
    const nv = unit(baseNormal(sol, f));
    const ref = Math.abs(nv[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    const tv1 = unit(cross(nv, ref));
    const tv2 = cross(nv, tv1);
    n.push(rot(nv, Math.PI / 6, Math.PI * 2 / 9));
    t1.push(rot(tv1, Math.PI / 6, Math.PI * 2 / 9));
    t2.push(rot(tv2, Math.PI / 6, Math.PI * 2 / 9));
  }
  return { n, t1, t2, ap: RADIUS * inRatio(sol) };
});

const L = unit([-0.45, -0.65, -0.60]);   // 指向光源：左上前方

// 每幀一次：每個面的深度係數 z = A + B·dx + C·dy、面座標係數與打光後的顏色
function shapeFrame(k, ax, ay) {
  const a = 2 * Math.PI * ax / 1024, b = 2 * Math.PI * ay / 1024;
  const { ap } = VEC[k];
  const faces = [];
  for (let f = 0; f < FACES[k]; f++) {
    const n = rot(VEC[k].n[f], a, b);
    const t1 = rot(VEC[k].t1[f], a, b);
    const t2 = rot(VEC[k].t2[f], a, b);
    const F = { nx: n[0], ny: n[1], ap };
    if (Math.abs(n[2]) < 1 / 256) {
      F.cls = 2;                           // 側面：nx·dx + ny·dy <= a
    } else {
      F.cls = n[2] < 0 ? 0 : 1;            // 0 正面、1 背面
      F.A = ap / n[2];
      F.B = -n[0] / n[2];
      F.C = -n[1] / n[2];
      F.U0 = t1[2] * F.A; F.Ux = t1[0] + t1[2] * F.B; F.Uy = t1[1] + t1[2] * F.C;
      F.V0 = t2[2] * F.A; F.Vx = t2[0] + t2[2] * F.B; F.Vy = t2[1] + t2[2] * F.C;
    }
    // 亮度 = 64 + 3·lit / 256（lit 為 Q0.14），顏色 = 底色 × (亮度 + 1) / 256，與硬體的量化相同
    const d = n[0] * L[0] + n[1] * L[1] + n[2] * L[2];
    const lit = d <= 0 ? 0 : Math.min(16383, Math.floor(d * 16384));
    const i8 = 64 + ((3 * lit) >> 8);
    const c = BASE[k].map(v => (v * (i8 + 1)) >> 8);
    F.rgb = c;
    faces.push(F);
  }
  return faces;
}

// ---------------------------------------------------------------------------
// 點雲的雜湊：與 HW_3_solid 相同的 24 bit XOR、旋轉與加法
// ---------------------------------------------------------------------------
const M24 = 0xFFFFFF;
const rotl = (v, r) => ((v << r) | (v >>> (24 - r))) & M24;

function mix(key) {
  const h1 = key ^ rotl(key, 5) ^ rotl(key, 11);
  const h2 = (h1 + rotl(h1, 9)) & M24;
  return h2 ^ rotl(h2, 15);
}

// 面座標 (u, v)（像素）是否落在點上：8 × 8 像素的格子，格子內位置以 1/4 像素計
function dotHit(u, v, keyHi) {
  const uq = Math.floor(u * 4), vq = Math.floor(v * 4);
  const h = mix((keyHi << 16) | ((Math.floor(vq / 32) & 255) << 8) | (Math.floor(uq / 32) & 255));
  if ((h & 255) >= DOT_KEEP) return false;
  const pu = 9 + 2 * ((h >> 8) & 7), pv = 9 + 2 * ((h >> 11) & 7);
  const wu = ((uq % 32) + 32) % 32, wv = ((vq % 32) + 32) % 32;
  return Math.abs(wu - pu) <= 2 && Math.abs(wv - pv) <= 2;
}

// ---------------------------------------------------------------------------
// 一幀畫面：st = { mode, holo, ax[], ay[] }，輸出 RGBA（Uint32，little endian）
// ---------------------------------------------------------------------------
const lab = new Uint8Array(W * H);       // 正面標籤：在形狀內 & 形狀編號 & 面編號
const blab = new Uint8Array(W * H);      // 背面標籤
const dot = new Uint8Array(W * H);
const shade = new Uint32Array(W * H);

const pack = (r, g, b) => (0xFF000000 | (b << 16) | (g << 8) | r) >>> 0;
const BLACK = pack(0, 0, 0), WHITE = pack(255, 255, 255);
const BASE_PX = BASE.map(c => pack(c[0], c[1], c[2]));

function render(st, out) {
  lab.fill(0);
  blab.fill(0);
  dot.fill(0);

  if (st.mode === 1) {
    for (let k = SHAPES - 1; k >= 0; k--) {
      const fs = shapeFrame(k, st.ax[k], st.ay[k]);
      const nf = fs.length;
      const x0 = Math.max(0, CX[k] - RADIUS - 2), x1 = Math.min(W - 1, CX[k] + RADIUS + 2);
      const y0 = Math.max(0, CY - RADIUS - 2), y1 = Math.min(H - 1, CY + RADIUS + 2);
      const fpx = fs.map(F => pack(F.rgb[0], F.rgb[1], F.rgb[2]));
      for (let y = y0; y <= y1; y++) {
        const dy = y - CY;
        for (let x = x0; x <= x1; x++) {
          const dx = x - CX[k];
          let zf = -Infinity, zb = Infinity, fi = -1, bi = -1, ok = true;
          for (let i = 0; i < nf; i++) {
            const F = fs[i];
            if (F.cls === 2) {
              if (F.nx * dx + F.ny * dy > F.ap) { ok = false; break; }
            } else {
              const z = F.A + F.B * dx + F.C * dy;
              if (F.cls === 0) { if (z > zf) { zf = z; fi = i; } }
              else if (z < zb) { zb = z; bi = i; }
            }
          }
          if (!ok || fi < 0 || bi < 0 || zf > zb) continue;
          const p = y * W + x;
          lab[p] = 128 + k * 32 + fi;
          blab[p] = 128 + k * 32 + bi;
          shade[p] = fpx[fi];
          if (st.holo) {
            const Ff = fs[fi], Fb = fs[bi];
            if (dotHit(Ff.U0 + Ff.Ux * dx + Ff.Uy * dy, Ff.V0 + Ff.Vx * dx + Ff.Vy * dy, k * 32 + fi) ||
                dotHit(Fb.U0 + Fb.Ux * dx + Fb.Uy * dy, Fb.V0 + Fb.Vx * dx + Fb.Vy * dy, 128 + k * 32 + bi)) {
              dot[p] = 1;
            }
          }
        }
      }
    }
  }

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const p = y * W + x;
      let px = BLACK;
      if (st.mode === 0) {
        let r = 0, g = 0, b = 0;
        for (const [bx, by, bw, bh, ch] of BLOCKS) {
          if (x >= bx && x < bx + bw && y >= by && y < by + bh) {
            if (ch === 0) r = 255; else if (ch === 1) g = 255; else b = 255;
          }
        }
        px = pack(r, g, b);
      } else {
        // 稜線：標籤和 (x-1)、(x-2)、(y-1)、(y-2) 任一個不同
        const q = lab[p];
        const ridge = q !== (x >= 1 ? lab[p - 1] : 0) || q !== (x >= 2 ? lab[p - 2] : 0) ||
                      q !== (y >= 1 ? lab[p - W] : 0) || q !== (y >= 2 ? lab[p - 2 * W] : 0);
        if (ridge) {
          px = WHITE;
        } else if (st.holo) {
          const bq = blab[p];
          const bridge = bq !== (x >= 1 ? blab[p - 1] : 0) || bq !== (x >= 2 ? blab[p - 2] : 0) ||
                         bq !== (y >= 1 ? blab[p - W] : 0) || bq !== (y >= 2 ? blab[p - 2 * W] : 0);
          if (dot[p]) px = BASE_PX[(q >> 5) & 3];
          else if (bridge && bq >= 128 && ((x + y) & 3) < 2) px = BASE_PX[(bq >> 5) & 3];
        } else if (q >= 128) {
          px = shade[p];
        }
      }
      out[p] = px;
    }
  }
}

// ---------------------------------------------------------------------------
// 板子的狀態與按鍵（對應 HW_3 的設定暫存器與角度累加）
// ---------------------------------------------------------------------------
const board = {
  mode: 1, holo: 0, dir: 0, speedSel: 1, running: true,
  ax: [0, 0, 0], ay: [0, 0, 0], frameCnt: 0,
};

function resetBoard() {
  Object.assign(board, { mode: 0, holo: 0, dir: 0, speedSel: 1, ax: [0, 0, 0], ay: [0, 0, 0], frameCnt: 0 });
}

function stepFrame(b) {
  b.frameCnt = (b.frameCnt + 1) & 63;
  if (!b.running) return;
  const s = (b.dir ? -1 : 1) << b.speedSel;
  for (let k = 0; k < SHAPES; k++) {
    b.ax[k] = (((b.ax[k] + SPIN_X[k] * s) % 1024) + 1024) % 1024;
    b.ay[k] = (((b.ay[k] + SPIN_Y[k] * s) % 1024) + 1024) % 1024;
  }
}

const $ = id => document.getElementById(id);
const canvas = $('screen');
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(W, H);
const pix = new Uint32Array(img.data.buffer);

const ledEls = [];
for (let i = 7; i >= 0; i--) {
  const d = document.createElement('div');
  d.className = 'led';
  d.title = 'LD' + i;
  $('leds').appendChild(d);
  ledEls[i] = d;
}

function updatePanel() {
  const leds = [board.mode, board.running ? 1 : 0, board.dir, board.speedSel & 1, board.speedSel >> 1,
                board.holo, 0, (board.frameCnt >> 5) & 1];
  leds.forEach((v, i) => ledEls[i].classList.toggle('on', !!v));
  $('stateText').textContent =
    (board.mode ? (board.holo ? '全息點雲' : '實心打光') : '基本色塊') +
    `　轉速 ×${1 << board.speedSel}` + (board.dir ? '　反轉' : '') + (board.running ? '' : '　暫停');
}

$('btnU').onclick = () => { board.mode ^= 1; };
$('btnD').onclick = () => { board.holo ^= 1; };
$('btnL').onclick = () => { board.speedSel = (board.speedSel + 1) & 3; };
$('btnR').onclick = () => { board.dir ^= 1; };
$('btnC').onclick = () => { resetBoard(); };
$('sw0').onchange = e => { board.running = !e.target.checked; };

let last = performance.now(), acc = 0, busy = false;
function tick(now) {
  acc += Math.min(now - last, 250) / 1000 * FRAME_HZ;
  last = now;
  while (acc >= 1) { stepFrame(board); acc -= 1; }
  if (!busy) {
    render({ mode: board.mode, holo: board.holo, ax: board.ax, ay: board.ay }, pix);
    ctx.putImageData(img, 0, 0);
  }
  updatePanel();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------------------------------------------------------------------------
// GIF89a 編碼器：每幀一個 local color table（打光的顏色會隨轉動變化，整段超過 256 色）
// ---------------------------------------------------------------------------
function lzw(indices, minCode, out) {
  const clear = 1 << minCode, eoi = clear + 1;
  let codeSize = minCode + 1, next = eoi + 1;
  let dict = new Map();
  let cur = 0, curBits = 0;
  const bytes = [];
  const emit = c => {
    cur |= c << curBits;
    curBits += codeSize;
    while (curBits >= 8) { bytes.push(cur & 255); cur >>>= 8; curBits -= 8; }
  };
  emit(clear);
  let prefix = indices[0];
  for (let i = 1; i < indices.length; i++) {
    const k = indices[i];
    const key = prefix * 256 + k;
    const hit = dict.get(key);
    if (hit !== undefined) { prefix = hit; continue; }
    emit(prefix);
    if (next === 4096) {
      emit(clear);
      dict = new Map();
      codeSize = minCode + 1;
      next = eoi + 1;
    } else {
      if (next >= (1 << codeSize)) codeSize++;
      dict.set(key, next++);
    }
    prefix = k;
  }
  emit(prefix);
  emit(eoi);
  if (curBits > 0) bytes.push(cur & 255);

  out.push(minCode);
  for (let i = 0; i < bytes.length; i += 255) {
    const n = Math.min(255, bytes.length - i);
    out.push(n);
    for (let j = 0; j < n; j++) out.push(bytes[i + j]);
  }
  out.push(0);
}

function u16(out, v) { out.push(v & 255, (v >> 8) & 255); }

function encodeGif(frames, w, h, delayCs) {
  const out = [];
  for (const c of 'GIF89a') out.push(c.charCodeAt(0));
  u16(out, w); u16(out, h);
  out.push(0x70, 0, 0);                    // 沒有 global color table
  out.push(0x21, 0xFF, 11);                // NETSCAPE2.0：無限循環
  for (const c of 'NETSCAPE2.0') out.push(c.charCodeAt(0));
  out.push(3, 1, 0, 0, 0);

  for (const fr of frames) {
    const map = new Map(), pal = [];
    const idx = new Uint8Array(fr.length);
    for (let i = 0; i < fr.length; i++) {
      const c = fr[i] & 0xFFFFFF;
      let j = map.get(c);
      if (j === undefined) {
        if (pal.length === 256) throw new Error('一幀超過 256 色');
        j = pal.length;
        map.set(c, j);
        pal.push(c);
      }
      idx[i] = j;
    }
    let bits = 1;
    while ((1 << bits) < pal.length) bits++;

    out.push(0x21, 0xF9, 4, 0x04);          // graphic control：不清除前一幀
    u16(out, delayCs);
    out.push(0, 0);
    out.push(0x2C);
    u16(out, 0); u16(out, 0); u16(out, w); u16(out, h);
    out.push(0x80 | (bits - 1));            // local color table，2^bits 色
    for (let i = 0; i < (1 << bits); i++) {
      const c = pal[i] || 0;
      out.push(c & 255, (c >> 8) & 255, (c >> 16) & 255);
    }
    lzw(idx, Math.max(2, bits), out);
  }
  out.push(0x3B);
  return new Uint8Array(out);
}

// 從角度 0 開始轉，前半段實心打光、後半段全息點雲；裁出形體所在的那一條
async function makeGif({ perStyle = 24, speedSel = 2, delayCs = 4, top = 120, height = 240 } = {}) {
  const b = { mode: 1, holo: 0, dir: 0, speedSel, running: true, ax: [0, 0, 0], ay: [0, 0, 0], frameCnt: 0 };
  const full = new Uint32Array(W * H);
  const frames = [];
  for (let i = 0; i < 2 * perStyle; i++) {
    b.holo = i < perStyle ? 0 : 1;
    render({ mode: 1, holo: b.holo, ax: b.ax, ay: b.ay }, full);
    frames.push(full.slice(top * W, (top + height) * W));
    stepFrame(b);
    if (i % 4 === 3) {
      $('status').textContent = `算第 ${i + 1} / ${2 * perStyle} 幀…`;
      await new Promise(r => setTimeout(r));
    }
  }
  $('status').textContent = '編碼中…';
  await new Promise(r => setTimeout(r));
  return encodeGif(frames, W, height, delayCs);
}

$('gifBtn').onclick = async () => {
  const btn = $('gifBtn');
  btn.disabled = true;
  busy = true;
  try {
    const gif = await makeGif();
    const url = URL.createObjectURL(new Blob([gif], { type: 'image/gif' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'spin.gif';
    a.textContent = '下載 spin.gif';
    $('status').textContent = `完成：${(gif.length / 1024).toFixed(0)} KB　`;
    $('status').appendChild(a);
  } catch (e) {
    $('status').textContent = '失敗：' + e.message;
  } finally {

  }
};

window.HW3 = { render, makeGif, encodeGif };
